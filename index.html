    <section><h2>${esc(d.h_skills)}</h2><div class="skills">${d.skills.map(([g,ts])=>`<div><h4>${esc(g)}</h4><div class="tags">${ts.map(t=>`<span dir="${hasAr(t)?'rtl':'ltr'}">${esc(t)}</span>`).join("")}</div></div>`).join("")}</div></section>
    <section class="duo">
      <div><h2>${esc(d.h_edu)}</h2>${d.edu.map(([a,b])=>`<p><strong>${esc(a)}</strong>${esc(b)}</p>`).join("")}</div>
      <div><h2>${esc(d.h_lang)}</h2><ul>${d.langs.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>
    </section>
    <pre class="loop"><span class="c">// time is infinite</span>
<span class="k">while</span> (time &lt; ∞) {
  learn();
  build();
  ship();
}</pre>
    <div class="cta"><a href="mailto:${EMAIL}">${esc(d.email_label)}</a><a class="ghost" href="tel:${PHONE}">${esc(d.call_label)} ${PHONE}</a></div>`;
}
$("toggle").addEventListener("click",()=>{ lang = lang==="en"?"ar":"en"; try{localStorage.setItem("cv-lang",lang)}catch(e){} render(); });
try{ const saved=localStorage.getItem("cv-lang"); if(saved==="ar"||saved==="en") lang=saved; }catch(e){}
render();


</script>
