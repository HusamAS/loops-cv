<head>

<style>
:root{
  --void:#03060e; --deep:#0b1a33; --streak:#2d9fde; --glow:#53b6e3; --tip:#acdbec; --ink:#e6f1fb; --mute:#8fa9c4; --line:rgba(83,182,227,.22);
  --sans:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root:not([data-theme="light"]){} :root[data-theme="dark"]{}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--void)}
body{background:var(--void);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#warp{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;object-fit:cover;image-rendering:pixelated}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(3,6,14,.75) 100%)}
main{position:relative;z-index:2}
.toggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);inset-inline-end:16px;z-index:5;font:500 .9rem var(--sans);color:var(--ink);background:rgba(3,6,14,.6);border:1px solid var(--line);padding:.45rem .9rem;border-radius:4px;cursor:pointer;backdrop-filter:blur(6px)}
.toggle:hover{border-color:var(--glow)} .toggle:focus-visible,a:focus-visible{outline:2px solid var(--tip);outline-offset:3px}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:6rem clamp(1.25rem,6vw,6rem) 4rem;max-width:1100px}
.prompt{font-family:var(--mono);color:var(--glow);font-size:clamp(1rem,2.2vw,1.25rem);direction:ltr;unicode-bidi:isolate;display:inline-block;margin-bottom:.5rem}
h1{font-size:clamp(2.8rem,9vw,6.5rem);font-weight:700;line-height:1;letter-spacing:-.02em;min-height:1em}
[dir=rtl] h1{letter-spacing:0}
.cursor{display:inline-block;width:.08em;height:.85em;background:var(--glow);margin-inline-start:.08em;vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.role{margin-top:1.1rem;font-size:clamp(1.05rem,2.4vw,1.45rem);color:var(--tip);font-weight:500}
.summary{margin-top:1.1rem;max-width:62ch;color:var(--mute);font-size:1.02rem}
.contact{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}
.contact a,.contact span{font-family:var(--mono);font-size:.88rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:rgba(11,26,51,.55);padding:.45rem .8rem;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.contact a:hover{border-color:var(--glow);color:var(--tip)}
.contact .loc{font-family:var(--sans)}
.hint{margin-top:3.5rem;font-family:var(--mono);font-size:.8rem;color:var(--mute);opacity:.7}

/* body sections */
.sheet{background:linear-gradient(to bottom,rgba(3,6,14,0),rgba(3,6,14,.88) 6rem);padding:4rem clamp(1.25rem,6vw,6rem) 5rem}
.wrap{max-width:1100px}
section{margin-top:4.5rem} section:first-child{margin-top:0}
h2{font-size:1.5rem;font-weight:600;color:var(--ink);margin-bottom:1.5rem;display:flex;align-items:center;gap:.8rem}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--streak),transparent)}
[dir=rtl] h2::after{background:linear-gradient(270deg,var(--streak),transparent)}
.value{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.value div{background:rgba(3,6,14,.92);padding:1.2rem 1.25rem}
.value b{display:block;color:var(--tip);font-weight:600;margin-bottom:.3rem}
.value p{color:var(--mute);font-size:.95rem}
.item{display:grid;grid-template-columns:minmax(0,1fr);padding:1.6rem 0;border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.4rem 1rem}
.item h3{font-size:1.3rem;font-weight:600}
.item h3 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--streak)} .item h3 a:hover{color:var(--tip)}
.meta{font-family:var(--mono);font-size:.82rem;color:var(--glow)}
.sub{color:var(--tip);opacity:.85;margin:.25rem 0 .7rem;font-size:.98rem}
.item ul{list-style:none;display:grid;gap:.45rem;max-width:75ch}
.item li{position:relative;padding-inline-start:1.2rem;color:#c3d4e6;font-size:.98rem}
.item li::before{content:"";position:absolute;inset-inline-start:0;top:.72em;width:.55rem;height:2px;background:var(--glow)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.6rem 2rem}
.skills h4{font-size:.95rem;color:var(--tip);font-weight:600;margin-bottom:.6rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem}
.tags span{font-family:var(--mono);font-size:.82rem;border:1px solid var(--line);padding:.25rem .6rem;border-radius:3px;background:rgba(45,159,222,.08);unicode-bidi:isolate}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2rem}
.duo p,.duo li{color:#c3d4e6} .duo ul{list-style:none} .duo strong{color:var(--ink);font-weight:600;display:block}
.loop{margin-top:5rem;font-family:var(--mono);font-size:.95rem;line-height:1.7;color:var(--tip);direction:ltr;text-align:left;white-space:pre;overflow-x:auto;border-inline-start:2px solid var(--streak);padding-inline-start:1.2rem}
[dir=rtl] .loop{border-inline-start:none;border-left:2px solid var(--streak);padding-left:1.2rem;padding-right:0}
.loop .c{color:var(--mute)} .loop .k{color:var(--glow)}
.cta{margin-top:3rem;display:flex;flex-wrap:wrap;gap:.8rem}
.cta a{font-weight:600;color:var(--void);background:var(--glow);padding:.75rem 1.3rem;border-radius:4px;text-decoration:none}
.cta a.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cta a:hover{background:var(--tip)} .cta a.ghost:hover{background:rgba(83,182,227,.12)}
@media (max-width:600px){.hero{padding-top:5rem}.sheet{padding-top:2.5rem}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
@media print{#warp,.scan,.vignette,.toggle,.hint{display:none}body{background:#fff;color:#000}}
</style>
</head>
